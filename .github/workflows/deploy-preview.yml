name: Vercel Preview Deployment

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches-ignore:
      - master

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/contracts_manager_ci
      NEXTAUTH_SECRET: ci-build-secret-at-least-32-characters-long
      NEXTAUTH_URL: http://localhost:3000
      MOBILE_JWT_SECRET: ci-mobile-jwt-secret-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy Preview
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      # Build on Vercel (not --prebuilt): Sensitive env vars cannot be pulled into
      # Actions (placeholders like https://[SENSITIVE] break NextAuth URL parsing).
      - name: Deploy Preview to Vercel
        run: vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }}
